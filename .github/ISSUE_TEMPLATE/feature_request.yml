name: Feature request
description: Describe a workflow Threadcap should support.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: Explain what you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and constraints
      description: Include provider/terminal support and any data, focus, or accessibility concerns.
