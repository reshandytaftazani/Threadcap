name: Bug report
description: Report a reproducible Threadcap problem.
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, follow SECURITY.md. Remove private prompts, credentials, account data, and personal paths from attachments."
  - type: input
    id: version
    attributes:
      label: Threadcap version
      placeholder: 0.8.4, installer or source build
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Windows version, agent CLI/version, terminal host, and relevant display scale.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the Connect state and whether the CLI was restarted after setup.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Optional logs or screenshots; use synthetic examples where possible.
