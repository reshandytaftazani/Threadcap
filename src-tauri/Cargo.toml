[package]
name = "vibe-island"
version = "0.8.4"
edition = "2021"
license = "MIT"
description = "A compact Windows companion for coding agent sessions"
default-run = "vibe-island"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
island-core = { path = "../crates/island-core" }
vibe-island-codex = { path = "../crates/codex-bridge" }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["net", "sync", "time", "process", "io-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_LibraryLoader"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
