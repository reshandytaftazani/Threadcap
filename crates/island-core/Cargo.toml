[package]
name = "island-core"
version = "0.4.0"
edition = "2021"
license = "MIT"

[dependencies]
async-stream = "0.3"
axum = "0.8"
futures-core = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
