<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Application icon study</title><style>body{background:#101114;color:#f5f5f7;font:14px 'Segoe UI',sans-serif;padding:32px;margin:0}h1{font-size:20px;font-weight:500}section{display:flex;gap:32px;align-items:center;padding:24px 0;border-bottom:1px solid #ffffff20}.sizes{display:flex;gap:28px;align-items:center}.on-light{background:#dedee3;padding:16px;border-radius:8px}p{color:#a8a8b3;max-width:640px;line-height:1.6}svg{display:block}</style></head><body><h1>Application mark · actual-size comparison</h1><p>Original geometric candidates. Compare silhouette and negative space at 16, 32, 64, and 128 pixels. These identify the application, separately from provider marks.</p><div id="candidates"></div><script>['a','b','c'].forEach(id=>{const row=document.createElement('section');const label=document.createElement('strong');label.textContent=id.toUpperCase();row.append(label);const sizes=document.createElement('div');sizes.className='sizes';for(const size of [16,32,64,128]){const img=document.createElement('img');img.src=`assets/island-app-candidates.svg#${id}`;img.width=size;img.height=size;img.alt=`Candidate ${id}, ${size} pixels`;sizes.append(img);}row.append(sizes);document.getElementById('candidates').append(row);});</script></body></html>
